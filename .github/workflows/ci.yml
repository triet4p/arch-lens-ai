name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Sync Python dependencies
        run: uv sync --frozen
        working-directory: python-sidecar

      - name: Check version sync
        run: pwsh scripts/check-version-sync.ps1

      - name: Run backend tests
        run: uv run pytest -v
        working-directory: python-sidecar

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Run frontend tests
        run: npm run test
        working-directory: frontend

      - name: Build packaged sidecar
        run: uv run python -m scripts.build_sidecar
        working-directory: python-sidecar

      - name: Smoke packaged sidecar
        run: pwsh scripts/smoke-sidecar.ps1

      - name: Cargo check
        run: cargo check
        working-directory: src-tauri

      - name: Build Tauri installer
        run: npx tauri build --bundles nsis
